name: comet_db_indexing
description: Indexing the database prior to the database search for Comet using CometAdapter fragindex.
keywords:
  - Indexing
  - database
  - comet
  - fragindex
tools:
  - CometAdapter:
      description: |
        OpenMS adapter for the Comet protein identification (database search) engine.
        The fragindex feature pre-generates index files to accelerate database searches.
      homepage: https://abibuilder.cs.uni-tuebingen.de/archive/openms/Documentation/nightly/html/TOPP_CometAdapter.html
      documentation: https://abibuilder.cs.uni-tuebingen.de/archive/openms/Documentation/nightly/html/TOPP_CometAdapter.html
input:
  - database:
      type: file
      description: fasta file
      pattern: "*.{fasta,fa}"
output:
  - idx_file:
      type: file
      description: Database index file generated by CometAdapter fragindex
      pattern: "*.idx"
  - log:
      type: file
      description: log file
      pattern: "*.log"
  - versions:
      type: file
      description: File containing software version
      pattern: "versions.yml"
authors:
  - "@MaLLLiYA"
